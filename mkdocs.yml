site_name: RIU Genesis Documentation
site_description: Integration and platform documentation for the RIU Hotels Genesis platform
repo_url: https://github.com/shawndale-glitch/riu-docs-demo
repo_name: RIU-Documentation
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn

nav:
  - Home: index.md
  - Guides:
      - Genesis and OPERA Cloud integration overview: guides/genesis-opera-integration-overview.md
      - Handle a late check-out request: guides/handle-late-check-out-request.md
  - Reference:
      - Identifier glossary: reference/identifier-glossary.md
      - Late check-out fees: reference/late-check-out-fees.md
  - Mapping:
      - RUMBO to OPERA Cloud mapping: mapping/index.md
      - Perfil de huésped to Profile (Guest): mapping/perfil-de-huesped.md
      - Decision and gap log: mapping/decision-log.md
  - Processes:
      - "FO-001: Solicitud de check-in anticipado": processes/front-office/FO-001.md
  - API:
      - API reference: api/index.md
      - Front Desk API (sample): api/front-desk.md
  - Release notes: release-notes/index.md
  - Contributing:
      - How content gets in: contributing/content-sources.md
      - Style guide: contributing/style-guide.md
      - "Guía para autores: diagramas en FigJam": contributing/guia-autores-figjam.md
