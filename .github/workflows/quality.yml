# Content and repository checks on every pull request. The job name `checks` is a required
# status check in governance/rulesets/main.json; rename both together.
name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Sensitive data (governance/sensitive-data.yaml)
        if: always()
        run: python tooling/sensitive_scan.py --report sensitive-report.md

      - name: Markdown lint (.pymarkdown.json)
        if: always()
        run: pymarkdown --config .pymarkdown.json scan -r docs README.md CONTRIBUTING.md governance

      - name: Product names and house terms (governance/terms.yaml)
        if: always()
        run: python tooling/terms_check.py

      - name: API reference matches its spec (tooling/api_render.py)
        if: always()
        run: python tooling/api_render.py docs/api/specs/front-desk.openapi.yaml --asyncapi docs/api/specs/front-desk.asyncapi.yaml --check

      - name: Pipeline self-test (library boards, lint rules, inventory)
        if: always()
        run: python tooling/selftest.py

      - name: Job summary
        if: always()
        run: |
          if [ -f sensitive-report.md ]; then cat sensitive-report.md >> "$GITHUB_STEP_SUMMARY"; fi
